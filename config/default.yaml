# Every path, number and seed a run needs, in one place: nothing below should be
# hardcoded in src/. Override from the CLI with dotted keys, e.g.
#   python scripts/prepare_data.py --override frames.ext=jpg

seed: 42

dataset:
  hf_repo_id: ucu-autonomous-ugv/Z-FPV-v1   # gated: request access on Hugging Face first
  class_names: [waiter_fpv_drone]           # YOLO class 0; COCO category_id 1 ("drone")

paths:
  raw_dir: data/raw/Z-FPV-v1                # videos/*.mp4 + labels/spie-video-*.zip (COCO JSON)
  checksums: data/raw/CHECKSUMS.txt
  split_manifest: config/splits/video_split_manifest.csv   # tracked in git: the split IS config
  frames_dir: data/interim/frames           # frames_dir/<video>/frame_000000.png
  yolo_dir: data/processed/yolo             # model-ready images/labels, laid out per split
  results_dir: results
  experiments_log: results/experiments.md

frames:
  # Frame names must match the COCO `file_name`s exactly (frame_000000.png, ...).
  # PNG is lossless (~5 GB for all frames at compression level 1); JPEG is ~5-10x smaller but adds a second
  # round of compression artifacts on top of the video codec. Team decision.
  ext: png

split:
  unit: video          # never split by frame: adjacent frames are near-duplicates (leakage)
  names: [train, val, test]

eval:
  # Shared evaluator settings, identical for every model in the comparison.
  # TODO(team): fix these before the first baseline run and do not change them afterwards.
  iou_thresholds: [0.5, 0.75]
  conf_threshold: null   # null = keep all predictions for mAP; set explicitly for P/R reporting
  max_detections: 100

baseline:
  # TODO(team): the exact baseline row — fill in BEFORE training, then don't touch.
  model: null          # e.g. family + size
  # Audit (results/audit/per_split.csv): at 640 the median val box is ~8 px, one cell of
  # YOLO's finest (stride-8) grid. Consider 1280 (~4x compute) or SAHI tiles.
  imgsz: null
  pretrained: null
  epochs: null

logging:
  level: INFO
